<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 24" fill="none" role="img" aria-label="The shadow a printer casts on its shelf">
  <defs>
    <!-- The pool of shadow directly under the machine. -->
    <radialGradient id="pool">
      <stop offset="0" stop-color="currentColor" stop-opacity=".3"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
    <!-- The shelf line, which fades out rather than ending. -->
    <linearGradient id="edge" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor" stop-opacity="0"/>
      <stop offset=".5" stop-color="currentColor" stop-opacity=".6"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="9" rx="96" ry="7" fill="url(#pool)"/>
  <path d="M8 16h224" stroke="url(#edge)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
