<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The installed app's icon. Full bleed, so a launcher may mask it to any
       shape. The letter sits inside the middle 60%, the part every mask keeps. -->
  <rect width="512" height="512" fill="#fa6831"/>
  <path fill="none" stroke="#fff" stroke-width="64"
        d="M340.85 171.15A120 120 0 1 0 340.85 340.85"/>
</svg>
