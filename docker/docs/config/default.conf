# The documentation site's server block. Replaces the image's default.conf.
#
# The built directory holds the site under /docs/ and a redirect page at its
# root, so a request for / lands on /docs/ through that page and every link
# in the content resolves. The listener is the image's unprivileged port.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # A directory reached without its trailing slash is redirected to it. Kept
    # relative, so the redirect carries whatever host and port the browser
    # used rather than the container's own.
    absolute_redirect off;

    # The 404 page Astro builds, copied to the served root by the site's
    # postbuild script. Its asset links resolve under /docs/.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build assets never change under their name, so a browser may keep
    # them for as long as it likes.
    location /docs/_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
