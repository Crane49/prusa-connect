# Base definition for the Prusa Connect server. No host port bindings: # those live in server.local.yml so two developers can run different ports
# without editing this file.
services:
  prusa-connect:
    build:
      context: ../..
      dockerfile: docker/server/Dockerfile
      # The version the binary reports. See PCL_BUILD_VERSION in .env.example.
      args:
        BUILD_VERSION: ${PCL_BUILD_VERSION:-}

    # Named rather than left to compose's `<project>-<service>` default, so CI
    # can build the image once, run the non-root gate against that tag, and then
    # bring this stack up on the very image it just checked. This service never
    # scales past one replica, so a fixed name is safe.
    image: prusa-connect:${PRUSA_CONNECT_TAG:-local}
    container_name: prusa_connect
    restart: unless-stopped

    env_file:
      - path: ../../.env
        required: false

    # No environment block. The core reads one file and its flags and reads no
    # environment variable, so a name set here reaches the process and changes
    # nothing. Set core.log.level in config/config.yaml for the log level.
    # Earlier research, gated by internal/arch/container_environment_test.go.

    labels:
      com.prusa3d.description: "Prusa Connect - printer gateway, REST/SSE/MQTT API and web UI"
      com.prusa3d.service: "api"

    volumes:
      - ../../config/config.yaml:/config/config.yaml:ro
      # The two files the server writes beside the operator's own: the
      # machine-owned resource overlay the API rewrites (core.overlay) and the
      # authorization graph (core.authz.database). The operator's file is
      # read-only and read_only below makes the rest of the root filesystem
      # immutable, so without this the core stops at startup with `mkdir
      # config/config.d: read-only file system`. Point both keys at /data
      # instead if one mutable path per instance suits the deployment better.
      - prusa_connect_config:/config/config.d
      # Named volumes, not bind mounts, and deliberately so: the image creates
      # /data, /files and /storage owned by uid 10001, and Docker seeds an empty
      # named volume from the image path carrying that ownership with it. A bind
      # mount keeps the host directory's own ownership, so it would need a chown
      # to 10001 before the non-root process could write. See
      # docker/server/Dockerfile.
      - prusa_connect_data:/data
      - prusa_connect_files:/files
      # The "local" storage in config/config.yaml writes to ./storage. Without
      # this it lands in the container layer and every `docker compose up
      # --force-recreate` silently discards whatever the operator uploaded.
      - prusa_connect_storage:/storage
      # read_only below makes the root filesystem immutable, but gin spills any
      # multipart upload over 32 MiB to os.TempDir(), and max_file_size is 4 GiB.
      # A tmpfs would put that in RAM, so /tmp gets a disk-backed volume instead.
      - prusa_connect_tmp:/tmp

    # Mirrors the Dockerfile's HEALTHCHECK, which stays there so a plain
    # `docker run` gets a probe too. Declared here as well so the timings are
    # tunable per environment and `depends_on: condition: service_healthy` has
    # something to wait on. Probes GET /api/v1/readiness through the binary, so
    # the image needs no curl or wget.
    healthcheck:
      test: ["CMD", "/prusa_connect", "core", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    # No cap_add. A printer-facing listener may be put below port 1024, but
    # container runtimes set net.ipv4.ip_unprivileged_port_start=0, so there is
    # no privileged range to need NET_BIND_SERVICE for. Verified on this image
    # as uid 10001 with the capability set empty. See the Dockerfile for why a
    # file capability on the binary is the wrong way to solve this.
    cap_drop:
      - ALL

    read_only: true

    deploy:
      resources:
        # Starting points, not measurements. The memory ceiling has to cover
        # gin's 32 MiB multipart buffer per in-flight upload plus the sqlite
        # page cache; raise it on a host serving many printers, and lower both
        # numbers on a Raspberry Pi once you have measured a real workload.
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 256M

    networks:
      - prusa_connect_backend

# Fixed names: a compose manager that rewrites the project name still finds
# the same volumes instead of creating empty ones.
volumes:
  prusa_connect_config:
    name: prusa-connect_prusa_connect_config
  prusa_connect_data:
    name: prusa-connect_prusa_connect_data
  prusa_connect_files:
    name: prusa-connect_prusa_connect_files
  prusa_connect_storage:
    name: prusa-connect_prusa_connect_storage
  prusa_connect_tmp:
    name: prusa-connect_prusa_connect_tmp

networks:
  prusa_connect_backend:
    name: prusa_connect_backend
    driver: bridge
