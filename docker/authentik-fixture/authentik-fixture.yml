# authentik, one of the real OpenID Connect providers the sign-in is checked
# against by `make oidc-providers-check` (scripts/check-oidc-providers.sh).
#
# A fixture, not a deployment: three containers that keep nothing. The
# database is on a tmpfs, and the provider, the application and both people
# come from the blueprint baked into the image (config/pcl.yaml). authentik
# takes the issuer's host name from each request, so the server on the host and
# the browser both see the issuer at the host port authentik-fixture.local.yml
# publishes.
#
# No host port here. It is in authentik-fixture.local.yml.
x-authentik-environment: &authentik-environment
  AUTHENTIK_SECRET_KEY: "pcl-authentik-fixture-secret-key-not-for-production"
  AUTHENTIK_POSTGRESQL__HOST: authentik-postgres-fixture
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: authentik
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_LOG_LEVEL: warning
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  # The bootstrap token is what the check reads each person's subject with,
  # over authentik's own API.
  AUTHENTIK_BOOTSTRAP_PASSWORD: "pcl-akadmin-password"
  AUTHENTIK_BOOTSTRAP_TOKEN: "pcl-authentik-fixture-token"
  AUTHENTIK_BOOTSTRAP_EMAIL: "akadmin@example.com"

services:
  authentik-postgres-fixture:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    container_name: prusa_connect_authentik_postgres_fixture
    # Behind a profile of its own, so neither a whole-stack `up` nor
    # `make fixtures-up` starts it. scripts/check-oidc-providers.sh names the
    # server and the worker, and compose starts this through depends_on.
    profiles:
      - oidc-providers
    restart: "no"
    env_file:
      - path: ../../.env
        required: false
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_DB: authentik
    labels:
      com.prusa3d.description: "authentik's database, for the sign-in check against real providers"
      com.prusa3d.service: "test-fixture"
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70
      - /var/run/postgresql:uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The entrypoint starts as root and drops to the postgres user.
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - prusa_connect_backend

  authentik-fixture:
    image: prusa-connect-authentik-fixture:local
    build:
      context: .
    container_name: prusa_connect_authentik_fixture
    profiles:
      - oidc-providers
    restart: "no"
    command: ["server"]
    depends_on:
      authentik-postgres-fixture:
        condition: service_healthy
      # The blueprint is the worker's to apply. Waiting for the worker keeps
      # `up --wait` from returning before there is a provider to sign in at.
      authentik-worker-fixture:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment: *authentik-environment
    labels:
      com.prusa3d.description: "authentik's web server, for the sign-in check against real providers"
      com.prusa3d.service: "test-fixture"
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 30
      # The first start runs every migration. Measured at about a minute on an
      # eight-core laptop. Rounded up for a two-core runner.
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - prusa_connect_backend

  authentik-worker-fixture:
    image: prusa-connect-authentik-fixture:local
    build:
      context: .
    container_name: prusa_connect_authentik_worker_fixture
    profiles:
      - oidc-providers
    restart: "no"
    command: ["worker"]
    depends_on:
      authentik-postgres-fixture:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment: *authentik-environment
    labels:
      com.prusa3d.description: "authentik's worker, which applies the blueprint, for the sign-in check"
      com.prusa3d.service: "test-fixture"
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - prusa_connect_backend

networks:
  prusa_connect_backend:
    name: prusa_connect_backend
    driver: bridge
