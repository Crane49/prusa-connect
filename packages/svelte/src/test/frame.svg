<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40" viewBox="0 0 120 40">
  <!-- A picture for the camera tests. It is deliberately not 4:3: a pane whose
       box followed the picture would change shape when this arrives, and the
       test measures that it does not. -->
  <rect width="120" height="40" fill="teal" />
  <circle cx="20" cy="20" r="10" fill="white" />
</svg>
