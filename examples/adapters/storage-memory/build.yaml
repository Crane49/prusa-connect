# The build configuration that puts the in-memory store into a binary
# (ADR-20260901-7t4).
#
# Run it with:
#
#   make compose-build BUILD_FILE=examples/adapters/storage-memory/build.yaml
#
# Every path below is read against this file's own directory, so the
# configuration means the same thing wherever it is run from.
core:
  path: ../../..

# The one line that admits the adapter. There is no second place to enable it:
# no blank import in the core tree, no adoption list entry, no build tag, no row
# in adapters/tags.json.
#
# The composition root adopts a registration whose namespace is not the core's
# automatically, so a binary built from this file offers `type: memory` on the
# resource plane and a binary built without it does not know the name at all.
#
# `path` is ADR-20260901-7t4 rule 15's path mode, which is for development and
# on-premise builds and pins nothing. A released adapter is named by version
# instead, and that is the mode where go.sum records what was pulled:
#
#   adapters:
#     - module: example.com/prusa/storage-memory
#       version: v0.1.0
adapters:
  - module: example.com/prusa/storage-memory
    path: .

# What make build reads as CONFIG_FILE. The tag and feature detectors read it,
# out of the resolved core, exactly as make build runs them. It is the core's
# own shipped file: a composed adapter takes no build tag (rule 11), so there is
# nothing here for this adapter to say.
config: ../../../config/config.yaml
variant: full
output: ../../../bin/server-storage-memory
