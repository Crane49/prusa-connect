# Based on https://github.com/maratori/golangci-lint-config
# Golden config for golangci-lint v2.14.0

version: "2"

run:
  build-tags:
    # Without these, nothing behind a database tag is linted, which is
    # internal/authz's four engine test files.
    - sqlite
    - postgres
    # Without this, every file behind `//go:build observability` is invisible
    # too.
    - observability

issues:
  # Maximum count of issues with the same text.
  # Set to 0 to disable.
  # Default: 3
  max-same-issues: 50

formatters:
  enable:
    - goimports # checks if the code and import statements are formatted according to the 'goimports' command
    - golines # checks if code is formatted, and fixes long lines

  settings:
    goimports:
      # A list of prefixes, which, if set, checks import paths
      # with the given prefixes are grouped after 3rd-party packages.
      # Default: []
      local-prefixes:
        - github.com/prusa3d/prusa-connect

    golines:
      # Target maximum line length.
      # Default: 100
      max-len: 120

linters:
  enable:
    - asasalint # checks for pass []any as any in variadic func(...any)
    - asciicheck # checks that your code does not contain non-ASCII identifiers
    - bidichk # checks for dangerous unicode character sequences
    - bodyclose # checks whether HTTP response body is closed successfully
    - canonicalheader # checks whether net/http.Header uses canonical header
    - copyloopvar # detects places where loop variables are copied (Go 1.22+)
    - cyclop # checks function and package cyclomatic complexity
    - dupl # tool for code clone detection
    - durationcheck # checks for two durations multiplied together
    - embeddedstructfieldcheck # checks embedded types in structs
    - errcheck # checking for unchecked errors, these unchecked errors can be critical bugs in some cases
    - errname # checks that sentinel errors are prefixed with the Err and error types are suffixed with the Error
    - errorlint # finds code that will cause problems with the error wrapping scheme introduced in Go 1.13
    - exhaustive # checks exhaustiveness of enum switch statements
    - exptostd # detects functions from golang.org/x/exp/ that can be replaced by std functions
    - fatcontext # detects nested contexts in loops
    - forbidigo # forbids identifiers
    - funcorder # checks the order of functions, methods, and constructors
    # - funlen # DISABLED: TODO - requires refactoring long functions into smaller ones
    - gocheckcompilerdirectives # validates go compiler directive comments (//go:)
    # - gochecknoglobals # DISABLED: global vars are necessary for logger, metrics (Prometheus/OpenTelemetry), singletons (sync.Once), graceful shutdown
    # - gochecknoinits # DISABLED: init() needed for generated code (Swagger) and safe logger fallback initialization
    - gochecksumtype # checks exhaustiveness on Go "sum types"
    - gocognit # computes and checks the cognitive complexity of functions
    # - goconst # DISABLED: TODO - 221 findings over 99 strings in 84 files, which
    # is its own change. goconst counts per package, so excluding a file moves a
    # finding to the next file rather than removing it, and the count is only
    # visible with --max-issues-per-linter=0 --max-same-issues=0.
    - gocritic # provides diagnostics that check for bugs, performance and style issues
    # - gocyclo # DISABLED: duplicate of cyclop, already disabled above
    # - godoclint # DISABLED: forces redundant symbol-name prefixes, breaks useful group comments
    # - godot # checks if comments end in a period - DISABLED: too strict
    - gomoddirectives # manages the use of 'replace', 'retract', and 'excludes' directives in go.mod
    - goprintffuncname # checks that printf-like functions are named with f at the end
    - gosec # inspects source code for security problems
    - govet # reports suspicious constructs, such as Printf calls whose arguments do not align with the format string
    - iface # checks the incorrect use of interfaces, helping developers avoid interface pollution
    - ineffassign # detects when assignments to existing variables are not used
    - intrange # finds places where for loops could make use of an integer range
    - iotamixing # checks if iotas are being used in const blocks with other non-iota declarations
    - loggercheck # checks key value pairs for common logger libraries (kitlog,klog,logr,zap)
    - makezero # finds slice declarations with non-zero initial length
    - mirror # reports wrong mirror patterns of bytes/strings usage
    - mnd # detects magic numbers
    - modernize # suggests simplifications to Go code, using modern language and library features
    - musttag # enforces field tags in (un)marshaled structs
    - nakedret # finds naked returns in functions greater than a specified function length
    - nestif # reports deeply nested if statements
    - nilerr # finds the code that returns nil even if it checks that the error is not nil
    - nilnesserr # reports that it checks for err != nil, but it returns a different nil value error (powered by nilness and nilerr)
    - nilnil # checks that there is no simultaneous return of nil error and an invalid value
    - noctx # finds sending http request without context.Context
    - nolintlint # reports ill-formed or insufficient nolint directives
    # - nonamedreturns # DISABLED: named returns improve readability when used with explicit return statements
    - nosprintfhostport # checks for misuse of Sprintf to construct a host with port in a URL
    - perfsprint # checks that fmt.Sprintf can be replaced with a faster alternative
    - predeclared # finds code that shadows one of Go's predeclared identifiers
    - promlinter # checks Prometheus metrics naming via promlint
    - protogetter # reports direct reads from proto message fields when getters should be used
    - reassign # checks that package variables are not reassigned
    - recvcheck # checks for receiver type consistency
    - revive # fast, configurable, extensible, flexible, and beautiful linter for Go, drop-in replacement of golint
    - rowserrcheck # checks whether Err of rows is checked successfully
    - sloglint # ensure consistent code style when using log/slog
    - spancheck # checks for mistakes with OpenTelemetry/Census spans
    - sqlclosecheck # checks that sql.Rows and sql.Stmt are closed
    - staticcheck # is a go vet on steroids, applying a ton of static analysis checks
    - testableexamples # checks if examples are testable (have an expected output)
    - testifylint # checks usage of github.com/stretchr/testify
    # - testpackage # DISABLED: many tests need access to unexported functions for white-box testing
    - tparallel # detects inappropriate usage of t.Parallel() method in your Go test codes
    - unconvert # removes unnecessary type conversions
    - unparam # reports unused function parameters
    - unqueryvet # detects SELECT * in SQL queries and SQL builders, encouraging explicit column selection
    - unused # checks for unused constants, variables, functions and types
    - usestdlibvars # detects the possibility to use variables/constants from the Go standard library
    - usetesting # reports uses of functions with replacement inside the testing package
    - wastedassign # finds wasted assignment statements
    - whitespace # detects leading and trailing whitespace

  settings:
    cyclop:
      # The maximal code complexity to report.
      # Default: 10
      max-complexity: 30
      # The maximal average package complexity.
      # If it's higher than 0.0 (float) the check is enabled.
      # Default: 0.0
      package-average: 10.0

    embeddedstructfieldcheck:
      # Checks that sync.Mutex and sync.RWMutex are not used as embedded fields.
      # Default: false
      forbid-mutex: true

    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      # Such cases aren't reported by default.
      # Default: false
      check-type-assertions: true

    exhaustive:
      # Program elements to check for exhaustiveness.
      # Default: [ switch ]
      check:
        - switch
        - map
      # connectorapi.Capability is an open vocabulary, not an enum. A driver
      # mints its own keys under its module path (ADR-20260825-dee rule 1), the shipped
      # xBuddy baseline alone carries 49 verbs and their arguments, and every
      # capability set in the tree is a subset on purpose: a profile subtracts,
      # and a map holding every key would be the one thing the intersection
      # model forbids. ADR-20260825-bhe rule 6 says the same thing from the other side:
      # the compiler cannot make a string constant a member of a set, and the
      # gate is the enforcement.
      # wirerpc.Method is open for the same reason: a contract publishes its
      # own method set, and this package publishes the two every child answers.
      # A map holding every method would mean one host serving every contract.
      ignore-enum-types: 'connectorapi\.Capability|wirerpc\.Method'

    funcorder:
      # Checks if the exported methods of a structure are placed before the non-exported ones.
      # Default: true
      struct-method: false

    nestif:
      min-complexity: 6

    revive:
      # Naming `rules` REPLACES revive's default set rather than adding to it,
      # so the defaults are listed explicitly. Dropping one here silently
      # disables that check everywhere.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
        # A file this long is several files that have not been separated yet.
        # Generated output, tests and the frozen offenders are excluded below.
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
    forbidigo:
      # Resolve an expression to its type before matching, so a rule can name a
      # method of one type rather than every method with that name.
      analyze-types: true
      # Naming `forbid` REPLACES forbidigo's default set, so the default pattern
      # is listed first rather than inherited.
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: (^|/)connectorapi\.FirmwareLabel\.String$
          msg: >-
            connectorapi.FirmwareLabel.String is the text a device reported, and
            reading it outside internal/printer/profile and
            internal/printer/capability is how behaviour comes from a version
            comparison instead of from a capability. "6.4.0" sorts
            above "6.10.0" as text, so a profile selected that way is the wrong
            profile. Ask the resolved capability set instead.

    funlen:
      # Checks the number of lines in a function.
      # If lower than 0, disable the check.
      # Default: 60
      lines: 100
      # Checks the number of statements in a function.
      # If lower than 0, disable the check.
      # Default: 40
      statements: 50

    gochecksumtype:
      # Presence of `default` case in switch statements satisfies exhaustiveness, if all members are not listed.
      # Default: true
      default-signifies-exhaustive: false

    gocognit:
      # Minimal code complexity to report.
      # Default: 30 (but we recommend 10-20)
      min-complexity: 20

    gocritic:
      # Settings passed to gocritic.
      # The settings key is the name of a supported gocritic checker.
      # The list of supported checkers can be found at https://go-critic.com/overview.
      settings:
        captLocal:
          # Whether to restrict checker to params only.
          # Default: true
          paramsOnly: false
        underef:
          # Whether to skip (*x).method() calls where x is a pointer receiver.
          # Default: true
          skipRecvDeref: false

    godoclint:
      # List of rules to enable in addition to the default set.
      # Default: empty
      enable:
        # Assert no unused link in godocs.
        # https://github.com/godoc-lint/godoc-lint?tab=readme-ov-file#no-unused-link
        - no-unused-link

    govet:
      # Enable all analyzers.
      # Default: false
      enable-all: true
      # Disable analyzers by name.
      # Run `GL_DEBUG=govet golangci-lint run --enable=govet` to see default, all available analyzers, and enabled analyzers.
      # Default: []
      disable:
        - fieldalignment # too strict
      # Settings per analyzer.
      settings:
        shadow:
          # Whether to be strict about shadowing; can be noisy.
          # Default: false
          strict: true

    mnd:
      # List of function patterns to exclude from analysis.
      # Values always ignored: `time.Date`,
      # `strconv.FormatInt`, `strconv.FormatUint`, `strconv.FormatFloat`,
      # `strconv.ParseInt`, `strconv.ParseUint`, `strconv.ParseFloat`.
      # Default: []
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets

    nakedret:
      # Make an issue if func has more lines of code than this setting, and it has naked returns.
      # Default: 30
      max-func-lines: 0

    nolintlint:
      # Exclude following linters from requiring an explanation.
      # Default: []
      allow-no-explanation: [ funlen, gocognit, golines ]
      # Enable to require an explanation of nonzero length after each nolint directive.
      # Default: false
      require-explanation: true
      # Enable to require nolint directives to mention the specific linter being suppressed.
      # Default: false
      require-specific: true

    perfsprint:
      # Optimizes into strings concatenation.
      # Default: true
      strconcat: false

    reassign:
      # Patterns for global variable names that are checked for reassignment.
      # See https://github.com/curioswitch/go-reassign#usage
      # Default: ["EOF", "Err.*"]
      patterns:
        - ".*"

    rowserrcheck:
      # database/sql is always checked.
      # Default: []
      packages:
        - github.com/jmoiron/sqlx

    sloglint:
      # Enforce not using global loggers.
      # Values:
      # - "": disabled
      # - "all": report all global loggers
      # - "default": report only the default slog logger
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#no-global
      # Default: ""
      no-global: all
      # Enforce using methods that accept a context.
      # Values:
      # - "": disabled
      # - "all": report all contextless calls
      # - "scope": report only if a context exists in the scope of the outermost function
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#context-only
      # Default: ""
      context: scope

    staticcheck:
      # SAxxxx checks in https://staticcheck.dev/docs/configuration/options/#checks
      # Example (to disable some checks): [ "all", "-SA1000", "-SA1001"]
      # Default: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
      checks:
        - all
        # Incorrect or missing package comment.
        # https://staticcheck.dev/docs/checks/#ST1000
        - -ST1000
        # Use consistent method receiver names.
        # https://staticcheck.dev/docs/checks/#ST1016
        - -ST1016
        # Omit embedded fields from selector expression.
        # https://staticcheck.dev/docs/checks/#QF1008
        - -QF1008

    usetesting:
      # Enable/disable `os.TempDir()` detections.
      # Default: false
      os-temp-dir: true

    testifylint:
      # Disable float-compare to allow strict float comparisons (best practice for exact values)
      disable:
        - float-compare

  exclusions:
    # Log a warning if an exclusion rule is unused.
    # Default: false
    warn-unused: true
    # Predefined exclusion rules.
    # Default: []
    presets:
      - std-error-handling
      - common-false-positives
    # Which file paths to exclude from reporting (analyzed but issues suppressed).
    paths:
      - frontend/node_modules
    # Excluding configuration per-path, per-linter, per-text and per-source.
    rules:
      # The sdk is the surface an extension author reads, so every exported
      # identifier there carries a doc comment and the linter refuses one that
      # does not. Everywhere else the rule stays off: internal/ documents what
      # needs an argument and not every accessor. cmd/generate-client-sdk holds
      # the matching gate over the OpenAPI document and the registries.
      - text: 'exported \S+ \S+ should have comment( \(or a comment on this block\))? or be unexported'
        path-except: '^sdk/'
        linters: [ revive ]
      # `version` and `build` are the conventional names for these packages and
      # read correctly at every call site (version.Version(), build.Detect()).
      # The std packages they nominally collide with: go/version and go/build:       # inspect the Go toolchain itself; an application server has no reason to
      # import either, so there is nothing to shadow. Scoped to these two
      # packages: the inline-nolint alternative is unstable for package-name
      # findings once a package spans >1 file.
      # The sdk is a nested module in this repository, resolved through a local
      # replace until it carries its own tag (ADR-20260824-gfr, rule 7). Scoped to that
      # one module path: replace-local would allow every local replacement,
      # including a dependency someone points at a working copy and commits.
      # Table-driven tests grow legitimately and splitting them by line count
      # hurts readability. Length is a signal about production code.
      - path: '_test\.go'
        text: 'file-length-limit'
        linters: [ revive ]
      # Functions whose complexity predates the gate. Frozen by file, annotated,
      # and shrinking the list is roadmap. A new file gets the full bar.
      - path: 'sdk/authapi/authapitest/contract\.go'
        linters: [ gocognit, cyclop, nestif ]
      - path: '_test\.go'
        linters: [ gocognit, cyclop, nestif ]
      - path: 'go\.mod'
        text: 'local replacement are not allowed: github\.com/prusa3d/prusa-connect/sdk'
        linters: [ gomoddirectives ]
      # An extension that links the 3MF reader binds the threemf extension
      # beside it through a local replace until that module carries its own
      # tag (ADR-20261028-jae). Scoped to that one module path, as the sdk is.
      - path: 'go\.mod'
        text: 'local replacement are not allowed: github\.com/prusa3d/threemf'
        linters: [ gomoddirectives ]
      # The two readers connectorapi.FirmwareLabel documents: the resolver that
      # selects a profile by parsing the components as numbers, and the profile
      # registry it selects from. Scoped to the one pattern rather than to the
      # linter, so fmt.Print stays forbidden in both. internal/arch's
      # TestTheFirmwareLabelGateIsArmed holds this list to the same two paths.
      - path: 'internal/printer/(profile|capability)/'
        text: 'FirmwareLabel\.String'
        linters: [ forbidigo ]
      - path: 'internal/(kernel/version|app/config/build)/'
        text: 'var-naming: avoid package names that conflict with Go standard library package names'
        linters: [ revive ]
      # The worked examples the OpenAPI document publishes. Every number in
      # these files is a value being shown to a reader: a free-space figure,
      # a modified time, a generation counter, a frame offset, a nozzle
      # temperature. None of them is a threshold the code compares against, so
      # naming each one would add twenty single-use constants and say nothing.
      # Status codes there still use net/http's names, and mnd stays armed
      # everywhere else. The pattern covers the whole examples family, because
      # the file an example lives in is decided by revive's length limit.
      - path: 'internal/transport/http/httpapi/examples[a-z]*\.go'
        linters: [ mnd ]
      # G701 reads every ExecContext and QueryContext in internal/authz as a
      # possible injection, because its taint analysis cannot see where the
      # query came from. Every one of them is a package-level const routed
      # through Store.q, which only renumbers '?' placeholders for Postgres,
      # or a dialect switch returning one of two consts. The migrations are
      # go:embed bytes of this checkout. Values never reach the text: they are
      # passed as bind arguments on the same call. The rule stays armed in
      # every other package, where a query built from a request could exist.
      - path: 'internal/authz/'
        text: 'G701'
        linters: [ gosec ]
      - path: '_test\.go'
        linters:
          - bodyclose
          - dupl
          - errcheck
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
